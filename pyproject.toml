[project]
name = "rae-local-agent"
version = "0.1.0"
description = "MCP server exposing a local Ollama coder model as a code-transformation tool for Claude Code"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
