name: PR title

# The PR title becomes the squash commit message, and release.yml reads that
# message to decide the version. This calls the shared check in rae004/.github
# so a malformed title fails here instead of silently skipping a release.
# Rules and docs: https://github.com/rae004/.github#pr-title-check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    uses: rae004/.github/.github/workflows/pr-title.yml@main
