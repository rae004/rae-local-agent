name: Repo settings

on:
  pull_request:
    paths:
      - ".github/repo/**"
      - "scripts/repo_settings.py"
      - ".github/workflows/repo-settings.yml"

permissions:
  contents: read

jobs:
  diff:
    name: diff against live settings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare .github/repo with GitHub
        run: python3 scripts/repo_settings.py diff
        env:
          # Default token reads repo + rulesets; Actions-permission endpoints need admin
          # and report `skipped` unless REPO_ADMIN_TOKEN (fine-grained PAT) is set.
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
